

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>漫画生成器 - 可视化编辑</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
  :root{--bg:#FFF8F0;--panel-bg:#FFF;--ink:#2D2B2A;--ink-light:#6B6560;--accent:#E8636F;--accent-soft:#F5A0A8;--sky:#A8D8EA;--sky-dark:#6BB7D0;--warm:#FFD93D;--warm-soft:#FFF0C2;--pink:#FFB5C2;--pink-soft:#FFE0E6;--green:#98D8AA;--border:#3D3A38;--bubble:#FFF;--bubble-her:#FFE8EC;--ed-border:#E8E4E0;--ed-bg:#FAF9F7}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Noto Sans SC',sans-serif;color:var(--ink);overflow:hidden;height:100vh}
  /* Toolbar */
  .toolbar{display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:48px;background:#fff;border-bottom:1px solid var(--ed-border);flex-shrink:0}
  .toolbar-title{font-family:'Ma Shan Zheng',cursive;font-size:20px;color:var(--accent)}
  .toolbar-actions{display:flex;gap:8px}
  /* App Layout */
  .app-layout{display:flex;height:calc(100vh - 48px);overflow:hidden}
  /* Editor Sidebar */
  .editor-sidebar{width:380px;flex-shrink:0;background:#fff;border-right:1px solid var(--ed-border);overflow-y:auto;height:100%}
  .editor-sidebar::-webkit-scrollbar{width:4px}
  .editor-sidebar::-webkit-scrollbar-thumb{background:#ddd;border-radius:2px}
  /* Editor Sections */
  .editor-section{padding:14px 16px;border-bottom:1px solid var(--ed-border)}
  .section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .section-title{font-size:12px;font-weight:600;color:var(--ink)}
  .editor-group{margin-bottom:8px}
  .editor-group label{display:block;font-size:11px;font-weight:500;color:var(--ink-light);margin-bottom:3px}
  .editor-group input,.editor-group textarea,.editor-group select{width:100%;padding:7px 10px;border:1.5px solid #E0DCD8;border-radius:6px;font-size:12px;font-family:'Noto Sans SC',sans-serif;background:var(--ed-bg);transition:border-color .2s}
  .editor-group input:focus,.editor-group textarea:focus,.editor-group select:focus{outline:none;border-color:var(--accent)}
  .editor-group textarea{min-height:56px;resize:vertical}
  .editor-row{display:flex;gap:8px}
  /* Chapter Tabs */
  .chapter-tabs{display:flex;flex-wrap:wrap;gap:4px;padding:10px 16px;border-bottom:1px solid var(--ed-border);background:#FAFAFA}
  .chapter-tab{display:flex;align-items:center;gap:3px;padding:5px 10px;border-radius:6px;font-size:11px;cursor:pointer;background:#fff;border:1px solid var(--ed-border);transition:all .2s;white-space:nowrap}
  .chapter-tab:hover{border-color:var(--accent-soft)}
  .chapter-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .chapter-tab.add{background:var(--warm-soft);border-color:var(--warm);color:#8B7355;font-weight:600}
  .tab-close{font-size:13px;line-height:1;opacity:.5;padding:0 2px;cursor:pointer}
  .tab-close:hover{opacity:1}
  /* Scene Cards */
  .scene-card{border:1.5px solid var(--ed-border);border-radius:8px;margin-bottom:8px;overflow:hidden}
  .scene-card-header{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--ed-bg);cursor:pointer;user-select:none}
  .scene-card-header:hover{background:var(--warm-soft)}
  .scene-card-title{font-size:12px;font-weight:600}
  .scene-card-actions{display:flex;align-items:center;gap:2px}
  .scene-card-body{padding:12px;border-top:1px solid var(--ed-border)}
  /* Icon Buttons */
  .btn-icon{width:22px;height:22px;border:none;background:transparent;cursor:pointer;border-radius:4px;font-size:11px;display:flex;align-items:center;justify-content:center;color:var(--ink-light);transition:all .2s}
  .btn-icon:hover{background:rgba(0,0,0,.06)}
  .btn-icon.delete:hover{background:#FFE0E6;color:var(--accent)}
  /* Buttons */
  .btn{padding:6px 14px;border:none;border-radius:6px;font-size:12px;font-family:'Noto Sans SC',sans-serif;cursor:pointer;transition:all .2s}
  .btn-sm{padding:4px 10px;font-size:11px}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover{background:#D45560}
  .btn-secondary{background:#F0EEEB;color:var(--ink)}
  .btn-secondary:hover{background:#E5E2DF}
  /* Dialogue Items */
  .dialogue-section{margin-top:10px;padding-top:10px;border-top:1px dashed var(--ed-border)}
  .dialogue-item{border:1px solid var(--ed-border);border-radius:6px;padding:10px;margin-bottom:6px;background:#fff}
  .dialogue-item.him{border-left:3px solid var(--sky)}
  .dialogue-item.her{border-left:3px solid var(--pink)}
  .thought-item{border:1px solid var(--ed-border);border-radius:6px;padding:10px;margin-bottom:6px;background:rgba(168,216,234,.06);border-left:3px solid var(--sky-dark)}
  .dialogue-header{display:flex;align-items:center;gap:6px;margin-bottom:6px}
  .dialogue-header select{width:56px;padding:3px 4px;border:1px solid var(--ed-border);border-radius:4px;font-size:11px;background:var(--ed-bg)}
  .dialogue-header input{flex:1;padding:3px 8px;border:1px solid var(--ed-border);border-radius:4px;font-size:11px;background:var(--ed-bg)}
  .dialogue-header input:focus,.dialogue-header select:focus{outline:none;border-color:var(--accent)}
  .dialogue-footer{display:flex;justify-content:flex-end;gap:2px;margin-top:4px}
  .dialogue-add-buttons{display:flex;gap:6px;margin-top:8px}
  /* Format Toolbar */
  .format-toolbar{display:flex;gap:2px;margin-top:4px}
  .fmt-btn{padding:2px 6px;font-size:10px;border:1px solid var(--ed-border);border-radius:3px;background:#fff;cursor:pointer;color:var(--ink-light)}
  .fmt-btn:hover{background:var(--warm-soft)}
  /* Preview Area */
  .preview-area{flex:1;overflow-y:auto;background:var(--bg)}
  .preview-area::-webkit-scrollbar{width:6px}
  .preview-area::-webkit-scrollbar-thumb{background:#ddd;border-radius:3px}
  /* Comic Container */
  .comic-container{max-width:480px;margin:0 auto;padding:0 12px 40px}
  /* Header */
  .header{text-align:center;padding:40px 20px 30px;position:relative}
  .header::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:radial-gradient(circle at 20% 50%,rgba(232,99,111,.08) 0%,transparent 50%),radial-gradient(circle at 80% 30%,rgba(168,216,234,.1) 0%,transparent 50%);pointer-events:none}
  .header h1{font-family:'Ma Shan Zheng',cursive;font-size:36px;color:var(--accent);letter-spacing:4px;margin-bottom:8px;text-shadow:2px 2px 0 rgba(232,99,111,.15)}
  .header .subtitle{font-family:'ZCOOL KuaiLe',cursive;font-size:14px;color:var(--ink-light);letter-spacing:2px}
  .header .deco-line{width:60px;height:3px;background:linear-gradient(90deg,var(--accent),var(--pink));margin:12px auto 0;border-radius:2px}
  /* Chapter */
  .chapter{display:flex;align-items:center;gap:12px;margin:32px 0 16px;padding:0 4px}
  .chapter-num{font-family:'Ma Shan Zheng',cursive;font-size:28px;color:var(--accent);line-height:1;flex-shrink:0}
  .chapter-line{flex:1;height:2px;background:linear-gradient(90deg,var(--accent-soft),transparent)}
  .chapter-title{font-family:'ZCOOL KuaiLe',cursive;font-size:16px;color:var(--ink-light);letter-spacing:2px;flex-shrink:0}
  /* Panels */
  .panel{background:var(--panel-bg);border:2.5px solid var(--border);border-radius:8px;margin-bottom:16px;overflow:hidden;position:relative;box-shadow:4px 4px 0 rgba(0,0,0,.08)}
  .panel-art{width:100%;display:block}
  .panel-caption{padding:10px 14px;font-size:13px;line-height:1.8;color:var(--ink);background:var(--panel-bg);border-top:1.5px dashed rgba(0,0,0,.1)}
  .panel-caption.narrator{font-style:italic;color:var(--ink-light);font-size:12.5px}
  /* Dialogue */
  .dialogue-row{display:flex;gap:10px;padding:14px;align-items:flex-start}
  .dialogue-row.reverse{flex-direction:row-reverse}
  .char-avatar{width:40px;height:40px;border-radius:50%;flex-shrink:0;border:2px solid var(--border);overflow:hidden}
  .char-avatar.him{background:var(--sky)}
  .char-avatar.her{background:var(--pink)}
  .bubble-wrap{max-width:75%;position:relative}
  .bubble-name{font-size:11px;font-weight:700;margin-bottom:4px;color:var(--ink-light)}
  .bubble-name.her{text-align:right}
  .bubble{padding:10px 14px;border-radius:16px;font-size:13.5px;line-height:1.7;position:relative;word-break:break-word}
  .bubble.him{background:var(--bubble);border:1.5px solid #ddd;border-bottom-left-radius:4px}
  .bubble.her{background:var(--bubble-her);border:1.5px solid var(--pink);border-bottom-right-radius:4px;text-align:right}
  .bubble .thought{font-size:11px;color:var(--ink-light);font-style:italic;display:block;margin-top:6px}
  .scene-illustration{width:100%;aspect-ratio:16/10;display:block}
  .timeline-date{display:inline-flex;align-items:center;gap:6px;background:var(--warm-soft);padding:4px 12px;border-radius:20px;font-size:11px;font-weight:500;color:#8B7355;margin:10px 14px}
  .timeline-date::before{content:'';width:6px;height:6px;background:var(--warm);border-radius:50%}
  .panel.dramatic{border-color:var(--accent);border-width:3px}
  .panel.romantic{border-color:var(--pink);background:linear-gradient(180deg,#FFF5F7,#FFF)}
  .panel.rain{background:linear-gradient(180deg,#E8F4F8,#FFF)}
  .inner-thought{text-align:center;padding:12px 20px;font-size:13px;color:var(--ink-light);font-style:italic;background:rgba(168,216,234,.15);border-left:3px solid var(--sky);margin:0 14px 14px;border-radius:0 8px 8px 0}
  .end-card{text-align:center;padding:30px 20px;margin-top:20px}
  .end-card .end-text{font-family:'Ma Shan Zheng',cursive;font-size:22px;color:var(--accent);letter-spacing:3px}
  .end-card .end-sub{font-size:12px;color:var(--ink-light);margin-top:8px}
  /* Author Comment */
  .author-comment{background:#2D2B2A;border-radius:10px;padding:28px 32px;margin:24px 0 0;position:relative;overflow:hidden;border-bottom-left-radius:10px;border-bottom-right-radius:10px;color: #F5E6D3;}
  .author-comment::before{content:'"';position:absolute;top:8px;left:16px;font-size:52px;font-family:Georgia,serif;color:var(--accent);opacity:.7;line-height:1}
  .author-comment .comment-body{color:#F5E6D3;font-size:13.5px;line-height:2;white-space:pre-line;padding-left:28px}
  .author-comment .comment-sig{color:var(--accent-soft);font-size:12px;text-align:right;margin-top:14px;padding-left:28px;font-style:italic}
  .fade-in{opacity:0;transform:translateY(20px);transition:opacity .6s ease,transform .6s ease}
  .fade-in.visible{opacity:1;transform:translateY(0)}
</style>
</head>
<body>

    <span class="toolbar-title">漫画生成器</span>
    <div class="toolbar-actions">

      <button class="btn btn-primary btn-sm" onclick="exportAsImage()">导出图片</button>
    </div>
  </div>
  <div class="app-layout">
    <div class="editor-sidebar" id="editorSidebar"></div>
    <div class="preview-area">
      <div class="comic-container" id="comicContainer"></div>
    </div>
  </div>

// === 工具函数 ===
function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showToast(msg) {
  const t = document.createElement('div');
  t.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#2D2B2A;color:#fff;padding:12px 24px;border-radius:8px;font-size:14px;z-index:9999;opacity:0;transition:opacity .3s';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.style.opacity = '1', 10);
  setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 2000);
}

// === 渲染漫画预览 ===
function renderComic() {
  const container = document.getElementById('comicContainer');
  let html = `<div class="header fade-in"><h1>${comicConfig.title}</h1><div class="subtitle">${comicConfig.subtitle}</div><div class="deco-line"></div></div>`;
  comicConfig.chapters.forEach(ch => {
    html += `<div class="chapter fade-in"><span class="chapter-num">${ch.number}</span><span class="chapter-line"></span><span class="chapter-title">${ch.title}</span></div>`;
    ch.scenes.forEach(scene => {
      const cls = scene.type !== 'normal' ? `panel ${scene.type} fade-in` : 'panel fade-in';
      html += `<div class="${cls}" id="preview-${scene.id}">`;
      if (scene.timeline) html += `<div class="timeline-date">${scene.timeline}</div>`;
      if (scene.illustration && illustrations[scene.illustration]) html += illustrations[scene.illustration];
      scene.dialogues.forEach(d => {
        if (d.thought) {
          html += `<div class="inner-thought">${d.thought}</div>`;
        } else {
          const rev = d.speaker === 'her';
          html += `<div class="dialogue-row${rev?' reverse':''}"><div class="char-avatar ${d.speaker}">${avatars[d.speaker]||''}</div><div class="bubble-wrap"><div class="bubble-name ${d.speaker}" style="color:${d.speaker==='him'?'#5B8DB8':'#E8636F'}">${d.name}</div><div class="bubble ${d.speaker}">${d.text}</div></div></div>`;
        }
      });
      if (scene.caption) {
        const narr = scene.caption.includes('他') || scene.caption.includes('她');
        html += `<div class="panel-caption${narr?' narrator':''}">${scene.caption}</div>`;
      }
      html += '</div>';
    });
  });
  if (comicConfig.authorComment && comicConfig.authorComment.enabled && comicConfig.authorComment.text) {
    html += `<div class="author-comment fade-in"><div class="comment-body">${comicConfig.authorComment.text}</div><div class="comment-sig">—— ${comicConfig.authorComment.author}视角</div></div>`;
  }
  html += `<div class="end-card fade-in"><div class="end-text">未完待续</div><div class="end-sub">感谢阅读</div></div>`;
  container.innerHTML = html;
  setTimeout(() => { document.querySelectorAll('.fade-in').forEach((el,i) => setTimeout(() => el.classList.add('visible'), i*80)); }, 50);
}

    h += `<div class="editor-section"><div class="section-title">章节设置</div>
      <div class="editor-row"><div class="editor-group" style="width:70px"><label>章节号</label><input type="text" value="${escapeHtml(ch.number)}" oninput="updateChapterField('number',this.value)"></div>
      <div class="editor-group" style="flex:1"><label>章节标题</label><input type="text" value="${escapeHtml(ch.title)}" oninput="updateChapterField('title',this.value)"></div></div></div>`;
    h += `<div class="editor-section"><div class="section-header"><span class="section-title">场景管理</span><button class="btn btn-sm btn-primary" onclick="addScene()">+ 添加场景</button></div>`;
    ch.scenes.forEach((scene, si) => { h += renderSceneCard(scene, si, ch.scenes.length); });
    h += '</div>';
  }
  sidebar.innerHTML = h;
}

function renderSceneCard(scene, si, total) {
  const expanded = expandedScenes.has(scene.id);
  let h = `<div class="scene-card"><div class="scene-card-header" onclick="toggleScene('${scene.id}')">
    <span class="scene-card-title">场景 ${si+1}${scene.illustration?' · '+((illLabels[scene.illustration])||''):''}</span>
    <div class="scene-card-actions">
      ${si>0?'<button class="btn-icon" onclick="event.stopPropagation();moveScene('+si+',\'up\')" title="上移">↑</button>':''}
      ${si<total-1?'<button class="btn-icon" onclick="event.stopPropagation();moveScene('+si+',\'down\')" title="下移">↓</button>':''}
      <button class="btn-icon delete" onclick="event.stopPropagation();deleteScene(${si})" title="删除">×</button>
      <span style="font-size:10px;color:var(--ink-light)">${expanded?'▼':'▶'}</span>
    </div></div>`;
  if (expanded) {
    h += `<div class="scene-card-body">
      <div class="editor-row">
        <div class="editor-group" style="flex:1"><label>场景样式</label><select onchange="updateSceneField(${si},'type',this.value)">
          <option value="normal"${scene.type==='normal'?' selected':''}>普通</option>
          <option value="dramatic"${scene.type==='dramatic'?' selected':''}>戏剧性</option>
          <option value="romantic"${scene.type==='romantic'?' selected':''}>浪漫</option>
          <option value="rain"${scene.type==='rain'?' selected':''}>雨天</option>
        </select></div>
        <div class="editor-group" style="flex:1"><label>插画</label><select onchange="updateSceneField(${si},'illustration',this.value)">
          <option value="">无插画</option>`;
    Object.keys(illustrations).forEach(k => { h += `<option value="${k}"${scene.illustration===k?' selected':''}>${illLabels[k]||k}</option>`; });
    h += `</select></div></div>
      <div class="editor-group"><label>时间线</label><input type="text" value="${escapeHtml(scene.timeline)}" oninput="updateSceneField(${si},'timeline',this.value)"></div>
      <div class="editor-group"><label>旁白/说明</label><textarea oninput="updateSceneField(${si},'caption',this.value)">${escapeHtml(scene.caption)}</textarea></div>
      <div class="dialogue-section"><div class="section-header"><span class="section-title">对话内容</span></div>`;
    scene.dialogues.forEach((item, di) => {
      if (item.thought) { h += renderThoughtItem(si, di, item, scene.dialogues.length); }
      else { h += renderDialogueItem(si, di, item, scene.dialogues.length); }
    });
    h += `<div class="dialogue-add-buttons">
      <button class="btn btn-sm btn-primary" onclick="addDialogueItem(${si})">+ 添加对话</button>
      <button class="btn btn-sm btn-secondary" onclick="addThoughtItem(${si})">+ 添加内心独白</button></div></div></div>`;
  }
  h += '</div>';
  return h;
}

function renderDialogueItem(si, di, item, total) {
  const spk = item.speaker || 'him';
  let h = `<div class="dialogue-item ${spk}">
    <div class="dialogue-header">
      <select onchange="updateDialogueField(${si},${di},'speaker',this.value)">
        <option value="him"${spk==='him'?' selected':''}>他</option>
        <option value="her"${spk==='her'?' selected':''}>她</option>
      </select>
      <input type="text" value="${escapeHtml(item.name||'')}" oninput="updateDialogueField(${si},${di},'name',this.value)" placeholder="角色名">
    </div>
    <div class="editor-group" style="margin-bottom:0"><textarea id="dlg-${si}-${di}" oninput="updateDialogueField(${si},${di},'text',this.value)" style="min-height:48px">${escapeHtml(item.text||'')}</textarea>
    <div class="format-toolbar">
      <button class="fmt-btn" onclick="insertFmt('dlg-${si}-${di}','<b>','</b>')" title="加粗">B</button>
      <button class="fmt-btn" onclick="insertFmt('dlg-${si}-${di}','<i>','</i>')" title="斜体">I</button>
      <button class="fmt-btn" onclick="insertFmt('dlg-${si}-${di}','<s>','</s>')" title="删除线">S</button>
      <button class="fmt-btn" onclick="insertFmt('dlg-${si}-${di}','<br>','')" title="换行">br</button>
      <button class="fmt-btn" onclick="insertFmt('dlg-${si}-${di}','<span class=&quot;thought&quot;>','</span>')" title="内心独白">独白</button>
    </div></div>
    <div class="dialogue-footer">
      ${di>0?'<button class="btn-icon" onclick="moveDialogueItem('+si+','+di+',\'up\')" title="上移">↑</button>':''}
      ${di<total-1?'<button class="btn-icon" onclick="moveDialogueItem('+si+','+di+',\'down\')" title="下移">↓</button>':''}
      <button class="btn-icon delete" onclick="deleteDialogueItem(${si},${di})" title="删除">×</button>
    </div></div>`;
  return h;
}

function renderThoughtItem(si, di, item, total) {
  return `<div class="thought-item">
    <div class="editor-group" style="margin-bottom:0"><label style="color:var(--sky-dark)">内心独白</label>
    <textarea id="tht-${si}-${di}" oninput="updateThoughtField(${si},${di},this.value)" style="min-height:36px">${escapeHtml(item.thought||'')}</textarea></div>
    <div class="dialogue-footer">
      ${di>0?'<button class="btn-icon" onclick="moveDialogueItem('+si+','+di+',\'up\')" title="上移">↑</button>':''}
      ${di<total-1?'<button class="btn-icon" onclick="moveDialogueItem('+si+','+di+',\'down\')" title="下移">↓</button>':''}
      <button class="btn-icon delete" onclick="deleteDialogueItem(${si},${di})" title="删除">×</button>
    </div></div>`;
}

// === 章节操作 ===
function switchChapter(idx) {
  currentChapterIndex = idx;
  expandedScenes.clear();
  renderEditor();
  renderComic();
}
function updateChapterField(field, val) {
  comicConfig.chapters[currentChapterIndex][field] = val;
  renderEditor();
  renderComic();
}
function addChapter() {
  const n = comicConfig.chapters.length + 1;
  const ch = { id: 'chapter'+n, number: '第'+n+'章', title: '新章节', scenes: [{ id: 'scene'+n+'_1', type:'normal', illustration:'', timeline:'', caption:'', dialogues:[] }] };
  comicConfig.chapters.push(ch);
  currentChapterIndex = comicConfig.chapters.length - 1;
  expandedScenes.clear();
  expandedScenes.add(ch.scenes[0].id);
  renderEditor();
  renderComic();
}
function deleteChapter(idx) {
  if (comicConfig.chapters.length <= 1) { showToast('至少保留一个章节'); return; }
  comicConfig.chapters.splice(idx, 1);
  if (currentChapterIndex >= comicConfig.chapters.length) currentChapterIndex = comicConfig.chapters.length - 1;
  expandedScenes.clear();
  renderEditor();
  renderComic();
}

// === 场景操作 ===
function toggleScene(sid) {
  if (expandedScenes.has(sid)) expandedScenes.delete(sid);
  else { expandedScenes.add(sid); scrollToScene(sid); }
  renderEditor();
}
function scrollToScene(sid) {
  setTimeout(() => { const el = document.getElementById('preview-'+sid); if (el) el.scrollIntoView({behavior:'smooth',block:'center'}); }, 100);
}
function updateSceneField(si, field, val) {
  comicConfig.chapters[currentChapterIndex].scenes[si][field] = val;
  renderComic();
}
function addScene() {
  const ch = comicConfig.chapters[currentChapterIndex];
  const n = ch.scenes.length + 1;
  const scene = { id: 'scene'+(currentChapterIndex+1)+'_'+n, type:'normal', illustration:'', timeline:'', caption:'', dialogues:[] };
  ch.scenes.push(scene);
  expandedScenes.add(scene.id);
  renderEditor();
  renderComic();
  scrollToScene(scene.id);
}
function deleteScene(si) {
  const ch = comicConfig.chapters[currentChapterIndex];
  if (ch.scenes.length <= 1) { showToast('至少保留一个场景'); return; }
  const sid = ch.scenes[si].id;
  ch.scenes.splice(si, 1);
  expandedScenes.delete(sid);
  renderEditor();
  renderComic();
}
function moveScene(si, dir) {
  const ch = comicConfig.chapters[currentChapterIndex];
  const ni = dir === 'up' ? si - 1 : si + 1;
  if (ni < 0 || ni >= ch.scenes.length) return;
  [ch.scenes[si], ch.scenes[ni]] = [ch.scenes[ni], ch.scenes[si]];
  renderEditor();
  renderComic();
}

// === 对话条目操作 ===
function addDialogueItem(si) {
  comicConfig.chapters[currentChapterIndex].scenes[si].dialogues.push({ speaker:'him', name:'', text:'' });
  renderEditor();
  renderComic();
}
function addThoughtItem(si) {
  comicConfig.chapters[currentChapterIndex].scenes[si].dialogues.push({ thought:'' });
  renderEditor();
  renderComic();
}
function deleteDialogueItem(si, di) {
  comicConfig.chapters[currentChapterIndex].scenes[si].dialogues.splice(di, 1);
  renderEditor();
  renderComic();
}
function moveDialogueItem(si, di, dir) {
  const arr = comicConfig.chapters[currentChapterIndex].scenes[si].dialogues;
  const ni = dir === 'up' ? di - 1 : di + 1;
  if (ni < 0 || ni >= arr.length) return;
  [arr[di], arr[ni]] = [arr[ni], arr[di]];
  renderEditor();
  renderComic();
}
function updateDialogueField(si, di, field, val) {
  const d = comicConfig.chapters[currentChapterIndex].scenes[si].dialogues[di];
  if (field === 'speaker') {
    d.speaker = val;
    renderEditor();
  } else {
    d[field] = val;
  }
  renderComic();
}
function updateThoughtField(si, di, val) {
  comicConfig.chapters[currentChapterIndex].scenes[si].dialogues[di].thought = val;
  renderComic();
}

// === 格式标签插入 ===
function insertFmt(id, open, close) {
  const ta = document.getElementById(id);
  if (!ta) return;
  const s = ta.selectionStart, e = ta.selectionEnd;
  const sel = ta.value.substring(s, e);
  ta.value = ta.value.substring(0, s) + open + sel + close + ta.value.substring(e);
  ta.selectionStart = s + open.length;
  ta.selectionEnd = s + open.length + sel.length;
  ta.focus();
  ta.dispatchEvent(new Event('input'));
}

// === 导出功能 ===
function exportConfig() {
  const blob = new Blob([JSON.stringify(comicConfig, null, 2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'comic-config.json';
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(a.href);
}
async function exportAsImage() {
  const container = document.getElementById('comicContainer');
  if (!container) return;
  showToast('正在生成图片...');
  try {
    const canvas = await html2canvas(container, { backgroundColor:'#FFF8F0', scale:2, useCORS:true, allowTaint:true, logging:false, width:container.scrollWidth, height:container.scrollHeight });
    const link = document.createElement('a'); link.download = comicConfig.title + '.png'; link.href = canvas.toDataURL('image/png'); link.click();
    showToast('图片已导出！');
  } catch (err) { console.error(err); showToast('导出失败，请重试'); }
}

// === 初始化 ===
document.addEventListener('DOMContentLoaded', function() {
  if (comicConfig.chapters.length > 0 && comicConfig.chapters[0].scenes.length > 0) {
    expandedScenes.add(comicConfig.chapters[0].scenes[0].id);
  }
  renderEditor();
  renderComic();
});
</script>
</body>
